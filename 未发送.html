<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ededed">
<meta name="color-scheme" content="light only">
<title>未发送 · 聊天体短篇</title>
<style>
  :root{
    --bg:#ededed;
    --me:#95ec69;
    --you:#ffffff;
    --ink:#191919;
    --muted:#a3a3a3;
    --line:#dcdcdc;
    --paper:#fffdf8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:#d9d9d9;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
    font-size:15px;line-height:1.6;
    display:flex;justify-content:center;
    overscroll-behavior:none;
  }
  .phone{
    width:100%;max-width:460px;height:100%;
    display:flex;flex-direction:column;
    background:var(--bg);
    box-shadow:0 0 40px rgba(0,0,0,.18);
  }
  header{
    flex:0 0 auto;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background:#f7f7f7;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
    z-index:5;
  }
  .back{font-size:26px;line-height:1;color:#333;margin-top:-3px;opacity:.85}
  .who{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center}
  .who b{font-size:16px;font-weight:600;letter-spacing:.5px}
  .who i{font-size:11px;color:var(--muted);font-style:normal;margin-top:1px;letter-spacing:.4px}
  .dots{font-size:16px;color:#333;letter-spacing:1px;opacity:.7}

  .chat{
    flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
    padding:14px 12px 22px;
    -webkit-overflow-scrolling:touch;
  }
  .titlecard{
    margin:6px 0 20px;padding:24px 18px;
    background:linear-gradient(160deg,#ffffff,#f3f1ec);
    border-radius:10px;
    text-align:center;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .titlecard h1{
    margin:0;font-size:22px;letter-spacing:7px;font-weight:500;color:#2b2b2b;
  }
  .titlecard p{margin:12px 0 0;font-size:12px;color:#9a968e;letter-spacing:1px;line-height:1.95}

  .time{
    text-align:center;font-size:11px;color:var(--muted);
    margin:18px 0 12px;letter-spacing:.5px;
  }
  .split{
    text-align:center;font-size:11px;color:#9c968c;
    margin:26px 0 16px;letter-spacing:1px;
    display:flex;align-items:center;gap:10px;
  }
  .split::before,.split::after{
    content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#cfc9bd,transparent);
  }

  .row{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
  .row.me{flex-direction:row-reverse}

  .av{
    flex:0 0 auto;width:34px;height:34px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#fff;letter-spacing:1px;
    margin-top:2px;user-select:none;
  }
  .av.you{background:linear-gradient(150deg,#c9a37a,#a97f57)}
  .av.me{background:linear-gradient(150deg,#7f8794,#5d6470)}
  .av.q{background:linear-gradient(150deg,#b9b3a6,#948d7f)}

  .bub{
    position:relative;max-width:calc(100% - 92px);
    padding:8px 12px;border-radius:7px;
    font-size:15px;line-height:1.62;word-break:break-word;
    white-space:pre-wrap;
  }
  .you .bub{background:var(--you);box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .me .bub{background:var(--me)}
  .you .bub::before{
    content:"";position:absolute;left:-5px;top:13px;
    border:5px solid transparent;border-right-color:var(--you);border-left:0;
  }
  .me .bub::before{
    content:"";position:absolute;right:-5px;top:13px;
    border:5px solid transparent;border-left-color:var(--me);border-right:0;
  }

  .row.fail .bub{opacity:.85}
  .bang{
    flex:0 0 auto;width:16px;height:16px;border-radius:50%;
    background:#e34d4d;color:#fff;font-size:11px;line-height:16px;
    text-align:center;font-weight:700;margin-top:14px;
  }

  .draft{
    margin:14px 0;padding:0;
    background:var(--paper);
    border:1px dashed #d6cdbc;
    border-radius:8px;
    overflow:hidden;
  }
  .dhead{
    display:flex;align-items:center;gap:8px;
    padding:7px 12px;
    background:rgba(0,0,0,.025);
    border-bottom:1px dashed #e2d9c9;
  }
  .badge{
    font-size:10px;letter-spacing:1px;color:#a8845a;
    border:1px solid #e0d1b8;border-radius:3px;
    padding:1px 5px;background:#fff;
  }
  .badge.del{color:#a09a90;border-color:#dedad2}
  .ddate{font-size:11px;color:#b3a894;letter-spacing:.5px;margin-left:auto}
  .dtext{
    padding:11px 13px;font-size:14.5px;line-height:1.72;
    color:#4a443c;white-space:pre-wrap;word-break:break-word;
  }
  .draft.isdel .dtext{
    color:#a9a29a;text-decoration:line-through;
    text-decoration-color:#cfc7bb;
  }

  .vbody{display:flex;align-items:center;gap:11px;padding:13px 14px 6px}
  .play{
    width:27px;height:27px;border-radius:50%;flex:0 0 auto;
    background:#c3b79f;color:#fff;font-size:11px;
    display:flex;align-items:center;justify-content:center;padding-left:2px;
  }
  .wave{display:flex;align-items:center;gap:2.5px;height:24px;flex:1}
  .wave i{display:block;width:2.5px;border-radius:2px;background:#d5cab5}
  .dur{font-size:12px;color:#a99e8b;letter-spacing:.5px}
  .vtext{
    padding:2px 14px 13px;font-size:12px;color:#a99e8b;
    line-height:1.9;letter-spacing:.3px;
  }

  .note{
    margin:26px 0 8px;text-align:center;
    font-size:12px;color:#9d978d;line-height:2.1;letter-spacing:.6px;
  }
  .end{
    text-align:center;margin:26px 0 10px;
    font-size:12px;color:#b5afa4;letter-spacing:8px;
  }

  footer{
    flex:0 0 auto;
    padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
    background:#f7f7f7;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:8px;
  }
  .fakeinput{
    flex:1;height:36px;border-radius:5px;background:#fff;
    display:flex;align-items:center;padding:0 12px;
    font-size:14px;color:#c2c2c2;letter-spacing:.5px;
  }
  .circle{
    width:30px;height:30px;border-radius:50%;
    border:1.5px solid #b9b9b9;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#b9b9b9;
  }

  @media (prefers-reduced-motion:no-preference){
    .time,.row,.draft,.split,.note{animation:up .45s ease both}
  }
  @keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="phone">
  <header>
    <span class="back">‹</span>
    <div class="who"><b>林晚</b><i>对方正在输入…</i></div>
    <span class="dots">···</span>
  </header>

  <main class="chat" id="chat"></main>

  <footer>
    <span class="circle">＋</span>

    <span class="circle">☺</span>
  </footer>
</div>

  {t:'you', av:'护', x:'刚才那个号是谁的'},
  {t:'me',  x:'一个朋友'},

  {t:'note', x:'手术很顺利。医生说发现得早，切掉就好了。\n\n他从开始疼，到躺上检查床，用了一个星期。\n她疼了两年，他一次都没逼她去过。\n\n后来每年十月三号凌晨两点十四分，\n他还是会下楼，站在门口等。\n他说怕外卖员找不到门。\n\n他等的不是粥。'},
  {t:'end', x:'完'}
];

const chat = document.getElementById('chat');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const WAVE = [6,10,14,9,18,12,20,15,8,16,11,19,13,7,15,10,17,12,6,14,9,16,11,8];

let html = '';
for (const m of D){
  switch(m.t){
    case 'title':
      html += `<div class="titlecard"><h1>${m.h}</h1><p>${m.s.replace(/\n/g,'<br>')}</p></div>`;
      break;
    case 'time':
      html += `<div class="time">${m.x}</div>`;
      break;
    case 'split':
      html += `<div class="split">${m.x}</div>`;
      break;
    case 'note':
      html += `<div class="note">${esc(m.x).replace(/\n/g,'<br>')}</div>`;
      break;
    case 'end':
      html += `<div class="end">${m.x}</div>`;
      break;
    case 'me':
      html += `<div class="row me"><div class="av me">野</div><div class="bub">${esc(m.x)}</div></div>`;
      break;
    case 'you':
      html += `<div class="row you"><div class="av ${m.av?'q':'you'}">${m.av||'晚'}</div><div class="bub">${esc(m.x)}</div></div>`;
      break;
    case 'draft':
      html += `<div class="draft ${m.del?'isdel':''}">
        <div class="dhead">
          <span class="badge ${m.del?'del':''}">${m.del?'已删除':'未发送'}</span>
          <span class="ddate">${m.d}</span>
        </div>
        <div class="dtext">${esc(m.x)}</div>
      </div>`;
      break;
    case 'voice':
      html += `<div class="draft">
        <div class="dhead">
          <span class="badge">未发送</span>
          <span class="ddate">${m.d}</span>
        </div>
        <div class="vbody">
          <span class="play">▶</span>
          <span class="wave">${WAVE.map(h=>`<i style="height:${h}px"></i>`).join('')}</span>
          <span class="dur">11″</span>
        </div>
        <div class="vtext">${esc(m.x).replace(/\n/g,'<br>')}</div>
      </div>`;
      break;
    case 'fail':
      html += `<div class="row me fail"><div class="bang">!</div><div class="bub">消息已发出，但被对方拒收了。</div></div>`;
      break;
  }
}
chat.innerHTML = html;
chat.scrollTop = 0;
</script>
</body>
</html>
